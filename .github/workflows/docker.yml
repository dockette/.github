name: Docker

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string

      tag:
        required: true
        type: string

      context:
        required: false
        type: string
        default: "."

      platforms:
        required: false
        type: string
        default: "linux/amd64,linux/arm64"

      push:
        required: false
        type: boolean
        default: true

      dockerfile:
        required: false
        type: string

      # Shell command to test the image before the push. The workflow first
      # builds the image for linux/amd64 and loads it into Docker as
      # IMAGE (image:tag). The command runs from the repository root.
      test:
        required: false
        type: string

jobs:
  docker-workflow:
    name: "${{ inputs.image }}:${{ inputs.tag }}"
    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A build without a push needs no credentials. Pull requests and Dependabot
      # have no access to the secrets, and the login would fail for them.
      - name: Login to DockerHub
        if: inputs.push
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        if: inputs.test
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile || format('{0}/Dockerfile', inputs.context) }}
          tags: ${{ inputs.image }}:${{ inputs.tag }}
          platforms: linux/amd64
          load: true
          cache-from: type=gha

      - name: Test
        if: inputs.test
        env:
          IMAGE: ${{ inputs.image }}:${{ inputs.tag }}
        run: ${{ inputs.test }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          push: ${{ inputs.push }}
          file: ${{ inputs.dockerfile || format('{0}/Dockerfile', inputs.context) }}
          tags: ${{ inputs.image }}:${{ inputs.tag }}
          platforms: ${{ inputs.platforms }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
